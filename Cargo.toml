[workspace]
resolver = "2"
members = ["ui", "web", "desktop", "mobile", "api"]

[workspace.dependencies.dioxus-primitives]
git = "https://github.com/DioxusLabs/components"
version = "0.0.1"
features = ["web"]

[workspace.dependencies]

dioxus = { version = "0.7.0-rc.2", features = ["router"] }
time = { version = "0.3.44", features = ["std", "macros"] }
tracing = "0.1.41"
dioxus-logger = "0.6.2"
http = "1.3.1"
serde = { version = "1", features = ["derive"] }
surrealdb = "2.3"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
tower = "0.5.2"
anyhow = "1.0.100"
axum = "0.8.6"
openssl = { version = "0.10", features = ["vendored"] }
web-sys = { version = "0.3.60", features = ["console"] }
dotenv = { version = "0.15.0" }
itertools = "*"

# workspace
ui = { path = "ui" }
api = { path = "api" }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
